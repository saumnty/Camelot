spring.application.name=clientes-ventas
server.port=${PORT:8080}

# ==================== Base de datos ====================
# Nunca escribas contraseñas reales aquí: el repo es público.
# En Render define estas variables de entorno (Environment):
#   SPRING_DATASOURCE_URL       jdbc:postgresql://<host-supabase>:5432/postgres?sslmode=require
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# Spring las toma automáticamente y reemplazan los valores de abajo,
# que solo sirven para desarrollo local.
spring.datasource.url=jdbc:postgresql://localhost:5432/clientes_ventas
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
# update: Hibernate agrega tablas y columnas nuevas al arrancar (nunca borra).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
spring.web.resources.cache.period=0

# ==================== Pagos ====================
# simulado: no mueve dinero real. Ver Pago/ProveedorPago.java para agregar uno real.
camelot.pagos.proveedor=simulado

# ==================== Importar productos ====================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Autollenado por código de barras con Open Food Facts (base abierta y gratuita)
camelot.openfoodfacts.habilitado=true
