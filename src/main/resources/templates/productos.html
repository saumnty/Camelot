<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camelot - Productos</title>
    <link rel="stylesheet" th:href="@{/css/landing.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ✅ CSRF PARA FETCH (IMPORTANTE) -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div class="app-container">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="main-content productos-page">
        <header class="content-header">

            <!--/*
            <div style="padding:10px; border:1px solid #444; margin:10px 0; border-radius:8px;">
            <div>auth: <span sec:authentication="name"></span></div>
            <div>authorities: <span sec:authentication="authorities"></span></div>
            <div sec:authorize="isAuthenticated()">✅ isAuthenticated TRUE</div>
            <div sec:authorize="!isAuthenticated()">❌ isAuthenticated FALSE</div>
            </div>
            */-->

                <div class="header-icons">
                    <i class="fas fa-tv"></i>
                    <i class="fas fa-laptop-code"></i>
                    <i class="fas fa-mobile-alt"></i>
                </div>
                <a th:href="@{/home}" class="home-center">
                    <i class="fas fa-house"></i>
                </a>
                <div class="help-icon">
                    <i class="fas fa-question-circle"></i>
                </div>
        </header>

        <section class="welcome-section">
            <div class="top-row">
                <div class="welcome-header">
                    <h1>Productos</h1>
                    <p class="welcome-subtitle">Listado de productos</p>
                </div>

                <div class="actions-row">
                    <a th:if="${puedeGestionarProductos and tiendaId != null}"
                        th:href="@{/productos/nuevo(tiendaId=${tiendaId})}"
                        class="btn-primary">
                        Agregar producto
                    </a>
                    <a th:if="${puedeGestionarProductos and tiendaId != null}"
                        th:href="@{/productos/importar(tiendaId=${tiendaId})}"
                        class="btn-secondary">
                        <i class="fas fa-file-import"></i>
                        Importar (Excel / CSV)
                    </a>


                    <a sec:authorize="hasRole('USER')"
                        th:if="${tienda != null and tienda.tipo.name() == 'PROVEEDOR' ? false : true}"
                        href="/carrito"
                        class="btn-primary">
                        <i class="fas fa-cart-shopping"></i>
                        Ver carrito
                    </a>


                    <div class="buscador">
                        <input type="text" id="buscar" placeholder="Buscar por nombre">
                        <button class="search-btn" type="button">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="productos-container">
            <div class="catalogo" th:each="catEntry : ${catalogo.entrySet()}">

                <h2 class="cat-title" th:text="${catEntry.key}">Categoría</h2>

                <div class="cat-body" th:each="subEntry : ${catEntry.value.entrySet()}">

                    <p class="subcat-title" th:text="${subEntry.key}">Subcategoría</p>

                    <div class="productos-grid">

                        <div class="producto-card"
                             th:each="producto : ${subEntry.value}"
                             th:attr="data-nombre=${producto.name}">

                            <div class="producto-card-image">
                                <img th:if="${producto.imagenUrl != null}"
                                     th:src="${producto.imagenUrl}"
                                     th:alt="'Imagen de ' + ${producto.name}">
                            </div>

                            <div class="producto-card-body">

                                <div class="producto-card-header">
                                    <h3 th:text="${producto.name}">Producto</h3>
                                    <span class="producto-precio">
                                        $<span th:text="${producto.precio}">0.00</span>
                                    </span>
                                </div>

                                <div class="producto-tags">
                                    <span class="tag"
                                          th:if="${producto.categoria != null}"
                                          th:text="${producto.categoria.nombre}">
                                    </span>

                                    <span class="tag tag-secundaria"
                                          th:if="${producto.subcategoria != null}"
                                          th:text="${producto.subcategoria.nombre}">
                                    </span>
                                </div>

                                <div class="producto-stock" th:if="${producto.stock != null}">
                                    Stock: <span th:text="${producto.stock}">0</span>
                                </div>

                                <div class="producto-actions"
                                     th:with="
                                        esAdminDeEsteProducto=${adminTiendaIds != null and producto.tienda != null and producto.tienda.id != null and #lists.contains(adminTiendaIds, producto.tienda.id)},
                                        puedeComprarEsteProducto=${!esAdminDeEsteProducto}
                                     ">

                                    <!-- ✅ COMPRAR (AJAX) -->
                                    <button th:if="${puedeComprarEsteProducto}"
                                            sec:authorize="hasRole('USER')"
                                            type="button"
                                            class="btn-primary btn-agregar-carrito"
                                            style="width:100%;"
                                            th:attr="data-id=${producto.id}">
                                        <i class="fas fa-cart-shopping"></i>
                                        Agregar al carrito
                                    </button>

                                    <!-- ✅ ADMIN -->
                                    <div th:if="${esAdminDeEsteProducto}"
                                         style="display:flex; gap:10px; width:100%;">

                                        <a th:href="@{'/productos/editar/' + ${producto.id}}"
                                           class="btn-secondary"
                                           style="flex:1;">
                                            Editar
                                        </a>

                                        <button type="button"
                                                class="btn-danger btn-eliminar"
                                                style="flex:1;"
                                                th:attr="data-id=${producto.id}, data-nombre=${producto.name}">
                                            Eliminar
                                        </button>
                                    </div>

                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- Modal eliminar producto -->
<div id="modal-eliminar" class="modal-overlay hidden">
    <div class="modal">
        <h3>Eliminar producto</h3>
        <p>
            ¿Seguro que quieres eliminar
            <strong id="modal-nombre-producto"></strong>?
        </p>

        <form id="form-eliminar" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="btn-cancelar-modal">
                    Cancelar
                </button>
                <button type="submit" class="btn-danger">
                    Sí, eliminar
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    /* ============================
       MODAL ELIMINAR PRODUCTO
    ============================= */
    const modal = document.getElementById('modal-eliminar');
    const nombreSpan = document.getElementById('modal-nombre-producto');
    const formEliminar = document.getElementById('form-eliminar');
    const btnCancelar = document.getElementById('btn-cancelar-modal');

    document.querySelectorAll('.btn-eliminar').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            const nombre = btn.dataset.nombre;

            nombreSpan.textContent = nombre;
            formEliminar.action = `/productos/eliminar/${id}`;
            modal.classList.remove('hidden');
        });
    });

    btnCancelar?.addEventListener('click', () => modal.classList.add('hidden'));
    modal?.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });

    /* ============================
       BUSCADOR EN VIVO
    ============================= */
    const inputBusqueda = document.getElementById('buscar');
    const cards = Array.from(document.querySelectorAll('.producto-card'));

    if (inputBusqueda) {
        inputBusqueda.addEventListener('input', () => {
            const query = inputBusqueda.value.trim().toLowerCase();
            cards.forEach(card => {
                const nombre = (card.dataset.nombre || '').toLowerCase();
                card.style.display = (query === '' || nombre.includes(query)) ? '' : 'none';
            });
        });
    }

    /* ============================
       AGREGAR AL CARRITO SIN RECARGAR (AJAX)
    ============================= */
    const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

    document.querySelectorAll('.btn-agregar-carrito').forEach(btn => {
        btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            if (!id) return;

            btn.disabled = true;

            try {
                const res = await fetch(`/carrito/api/agregar/${id}`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        [csrfHeader]: csrfToken
                    }
                });

                if (!res.ok) throw new Error('No se pudo agregar');

                const original = btn.innerHTML;
                btn.innerHTML = '✅ Agregado';

                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.disabled = false;
                }, 900);

            } catch (e) {
                btn.disabled = false;
                alert('No se pudo agregar al carrito');
            }
        });
    });

});
</script>
</body>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('.menu-toggle');
            const sidebar = document.querySelector('.sidebar');

            toggleBtn?.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
            });
        });
    </script>
</html>
