<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/sidebar :: head('Gastos externos')}"></head>
<body>
<div class="app-container">
  <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

  <main class="main-content">
    <div class="page-wrap">
      <h1 class="page-title">Gastos externos</h1>
      <p class="page-subtitle">Gastos o compras que <b>no</b> pasaron por Camelot (hielo, bolsas, transporte…). Solo afectan los reportes.</p>

      <th:block th:replace="~{fragments/sidebar :: flash}"></th:block>

      <section class="panel">
        <h2>Registrar</h2>
        <form th:action="@{/admin/compra-externa/guardar}" method="post">
          <input type="hidden" name="tiendaId" th:value="${tiendaId}">
          <div class="campos">
            <div class="campo">
              <label for="fecha">Fecha</label>
              <input type="date" id="fecha" name="fecha" th:value="${fecha}" required>
            </div>
            <div class="campo">
              <label for="total">Total ($)</label>
              <input type="number" id="total" name="total" step="0.01" min="0" placeholder="0.00" required>
            </div>
            <div class="campo campo-full">
              <label for="concepto">Concepto</label>
              <input type="text" id="concepto" name="concepto" maxlength="140" placeholder="Ej. Hielo / Bolsas / Transporte" required>
            </div>
            <div class="campo campo-full">
              <label for="nota">Nota (opcional)</label>
              <input type="text" id="nota" name="nota" maxlength="255">
            </div>
          </div>
          <div class="form-actions" style="margin-top:14px;">
            <button type="submit" class="btn-primary"><i class="fas fa-plus"></i> Registrar</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
          <h2 style="margin:0;">Del día</h2>
          <form method="get" th:action="@{/admin/compra-externa}" class="inline-form">
            <input type="hidden" name="tiendaId" th:value="${tiendaId}">
            <input type="date" name="fecha" th:value="${fecha}" style="width:auto;">
            <button class="btn-sm btn-ghost" type="submit">Ver</button>
          </form>
        </div>
        <table class="tabla">
          <thead><tr><th>Concepto</th><th>Nota</th><th>Total</th><th></th></tr></thead>
          <tbody>
          <tr th:each="x : ${lista}">
            <td th:text="${x.concepto}">Concepto</td>
            <td th:text="${x.nota}"></td>
            <td th:text="${'$' + #numbers.formatDecimal(x.total, 1, 'COMMA', 2, 'POINT')}">$0</td>
            <td>
              <div class="item-actions">
                <a class="btn-sm btn-ghost" th:href="@{/admin/compra-externa/ticket/{id}(id=${x.id}, tiendaId=${tiendaId})}">Ticket</a>
                <form th:action="@{/admin/compra-externa/eliminar/{id}(id=${x.id})}" method="post"
                      onsubmit="return confirm('¿Eliminar este gasto?');">
                  <input type="hidden" name="tiendaId" th:value="${tiendaId}">
                  <input type="hidden" name="fecha" th:value="${fecha}">
                  <button class="btn-sm btn-danger" type="submit"><i class="fas fa-trash"></i></button>
                </form>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
        <div class="vacio" th:if="${#lists.isEmpty(lista)}">Sin gastos este día.</div>
        <p style="margin-top:12px;"><b>Total del día:</b>
          <span th:text="${'$' + #numbers.formatDecimal(totalDia, 1, 'COMMA', 2, 'POINT')}">$0.00</span></p>
      </section>
    </div>
  </main>
</div>
</body>
</html>
