<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/sidebar :: head('Solicitudes de dueño')}"></head>
<body>
<div class="app-container">
  <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

  <main class="main-content">
    <div class="page-wrap">
      <h1 class="page-title">Solicitudes de dueño</h1>
      <p class="page-subtitle" th:text="${tienda.nombre}">Tienda</p>

      <th:block th:replace="~{fragments/sidebar :: flash}"></th:block>
      <div class="flash flash-info" th:if="${msg != null}" th:text="${msg}">mensaje</div>

      <section class="panel">
        <h2>Pendientes</h2>
        <div class="lista">
          <div class="item" th:each="s : ${pendientes}">
            <div class="item-icon"><i class="fas fa-user-shield"></i></div>
            <div class="item-body">
              <div class="item-title" th:text="${s.solicitante.name}">Nombre</div>
              <div class="item-text" th:if="${s.nota != null}" th:text="'“' + ${s.nota} + '”'">nota</div>
              <div class="item-meta" th:text="${#temporals.format(s.createdAt, 'dd/MM/yyyy HH:mm')}">fecha</div>
            </div>
            <div class="item-actions">
              <form th:action="@{|/tiendas/${tienda.id}/solicitudes/admin/${s.id}/aprobar|}" method="post">
                <button class="btn-sm btn-ok" type="submit"><i class="fas fa-check"></i> Aprobar</button>
              </form>
              <form th:action="@{|/tiendas/${tienda.id}/solicitudes/admin/${s.id}/rechazar|}" method="post">
                <button class="btn-sm btn-danger" type="submit"><i class="fas fa-xmark"></i> Rechazar</button>
              </form>
            </div>
          </div>
          <div class="vacio" th:if="${#lists.isEmpty(pendientes)}">No hay solicitudes pendientes.</div>
        </div>
      </section>

      <section class="panel">
        <h2>Historial</h2>
        <div class="tabla-wrap">
          <table class="tabla">
            <thead><tr><th>Solicitante</th><th>Estado</th><th>Resuelto por</th><th>Fecha</th></tr></thead>
            <tbody>
            <tr th:each="s : ${historial}">
              <td th:text="${s.solicitante.name}">Nombre</td>
              <td>
                <span class="pill"
                      th:classappend="${s.estado.name() == 'APROBADA' ? 'pill-ok' : s.estado.name() == 'RECHAZADA' ? 'pill-err' : 'pill-warn'}"
                      th:text="${s.estado}">PENDIENTE</span>
              </td>
              <td th:text="${s.resolvedBy != null ? s.resolvedBy.name : '—'}">—</td>
              <td th:text="${s.resolvedAt != null ? #temporals.format(s.resolvedAt, 'dd/MM/yyyy HH:mm') : #temporals.format(s.createdAt, 'dd/MM/yyyy HH:mm')}">—</td>
            </tr>
            </tbody>
          </table>
          <div class="vacio" th:if="${#lists.isEmpty(historial)}">Sin historial todavía.</div>
        </div>
      </section>

      <a class="btn-sm btn-ghost" th:href="@{|/tiendas/${tienda.id}|}"><i class="fas fa-arrow-left"></i> Volver a la tienda</a>
    </div>
  </main>
</div>
</body>
</html>
