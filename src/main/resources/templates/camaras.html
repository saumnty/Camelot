<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camelot - Productos</title>
    <link rel="stylesheet" th:href="@{/css/landing.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ✅ CSRF PARA FETCH (IMPORTANTE) -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div class="app-container">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="main-content camaras-page">
  <header class="content-header">
    <div class="header-icons">
      <i class="fas fa-tv"></i>
      <i class="fas fa-laptop-code"></i>
      <i class="fas fa-mobile-alt"></i>
    </div>

    <a th:href="@{/home}" class="home-center">
      <i class="fa-solid fa-house"></i>
    </a>

    <div class="help-icon">
      <i class="fas fa-question-circle"></i>
    </div>
  </header>

  <section class="welcome-section">
  <div class="top-row">
    <div class="welcome-header">
      <h1>Cámaras</h1>
      <p class="welcome-subtitle">Listado de cámaras registradas</p>
    </div>

    <div class="actions-row">
      <a th:href="@{/camaras/nueva(tiendaId=${tiendaId})}" class="btn-primary">
        <i class="fas fa-plus"></i>
        Añadir cámara
      </a>
    </div>
  </div>

  <div th:if="${mensajeExito}" class="alert-success" th:text="${mensajeExito}"></div>
  <div th:if="${mensajeError}" class="alert-error" th:text="${mensajeError}"></div>
</section>

<section class="camaras-container">
  <div class="card">
    <div class="card-header">
      <h3>Listado</h3>
      <p class="card-subtitle">Acciones rápidas por cámara</p>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>RTSP</th>
          <th>Activo</th>
          <th style="text-align:right;">Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="c : ${camaras}">
          <td th:text="${c.id}"></td>
          <td th:text="${c.nombre}"></td>

          <td class="mono">
            <span th:text="${c.rtspUrl}"></span>
          </td>

          <td>
            <span class="badge"
                  th:classappend="${c.activo} ? ' badge-ok' : ' badge-off'"
                  th:text="${c.activo} ? 'ACTIVA' : 'INACTIVA'"></span>
          </td>

          <td class="actions-cell">
            <form th:action="@{|/camaras/${c.id}/probar|}" method="post">
              <button class="btn-secondary btn-mini" type="submit">
                <i class="fas fa-play"></i> Probar
              </button>
            </form>

            <form th:action="@{|/camaras/${c.id}/toggle|}" method="post">
              <button class="btn-secondary btn-mini" type="submit"
                      th:text="${c.activo ? 'Desactivar' : 'Activar'}"></button>
            </form>

            <form th:action="@{|/camaras/${c.id}/eliminar|}" method="post">
              <button class="btn-danger btn-mini" type="submit">
                Eliminar
              </button>
            </form>
          </td>
        </tr>

        <tr th:if="${camaras == null or #lists.isEmpty(camaras)}">
          <td colspan="5" class="empty-row">No hay cámaras registradas todavía.</td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</main>
</div>

</body>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('.menu-toggle');
            const sidebar = document.querySelector('.sidebar');

            toggleBtn?.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
            });
        });
    </script>
</html>
