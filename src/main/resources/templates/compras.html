<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/sidebar :: head('Mis compras')}"></head>
<body>
<div class="app-container">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <main class="main-content">
        <div class="page-wrap">
            <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;">
                <div>
                    <h1 class="page-title">Mis compras</h1>
                    <p class="page-subtitle">Tus pedidos en todas las tiendas.</p>
                </div>
                <div class="campo" style="min-width:240px;">
                    <input type="search" id="buscar" placeholder="Buscar por tienda, estado, fecha…">
                </div>
            </div>

            <th:block th:replace="~{fragments/sidebar :: flash}"></th:block>

            <section class="panel">
                <div class="tabla-wrap">
                    <table class="tabla">
                        <thead>
                        <tr><th>#</th><th>Fecha</th><th>Tienda</th><th>Total</th><th>Pago</th><th>Estado</th><th></th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="compra : ${listaCompras}" class="fila-compra"
                            th:attr="data-text=|${compra.id} ${#temporals.format(compra.fecha,'dd/MM/yyyy')} ${compra.tienda.nombre} ${compra.estado}|">
                            <td th:text="${compra.id}">1</td>
                            <td th:text="${#temporals.format(compra.fecha,'dd/MM/yyyy HH:mm')}">fecha</td>
                            <td>
                                <a th:href="@{/tiendas/{id}(id=${compra.tienda.id})}" th:text="${compra.tienda.nombre}">Tienda</a>
                            </td>
                            <td><b th:text="${'$' + #numbers.formatDecimal(compra.total, 1, 'COMMA', 2, 'POINT')}">$0</b></td>
                            <td>
                                <th:block th:if="${compra.metodoPago != null}">
                                    <span th:text="${compra.metodoPago.etiqueta()}">Tarjeta</span><br>
                                    <small class="item-meta" th:text="${compra.estadoPago.etiqueta()}">Pagado</small>
                                </th:block>
                                <span th:unless="${compra.metodoPago != null}" class="item-meta">—</span>
                            </td>
                            <td>
                                <span class="pill"
                                      th:classappend="${compra.estado.name() == 'PENDIENTE' ? 'pill-warn' :
                                                        compra.estado.name() == 'CONFIRMADA' ? 'pill-ok' :
                                                        compra.estado.name() == 'REEMBOLSADA' ? 'pill-info' : 'pill-err'}"
                                      th:text="${compra.estado.name() == 'PENDIENTE' ? 'En revisión' :
                                                compra.estado.name() == 'CONFIRMADA' ? 'Confirmada' :
                                                compra.estado.name() == 'REEMBOLSADA' ? 'Reembolsada' : 'Cancelada'}">Estado</span>
                                <div class="item-meta" th:if="${compra.motivo != null}" th:text="${compra.motivo}">motivo</div>
                            </td>
                            <td>
                                <a class="btn-sm btn-ghost" th:href="@{/compras/ticket/{id}(id=${compra.id})}">
                                    <i class="fas fa-receipt"></i> Ticket
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="vacio" th:if="${#lists.isEmpty(listaCompras)}">
                        Aún no has comprado nada. <a th:href="@{/home}"><b>Explora las tiendas</b></a>.
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
<script>
    (function () {
        const input = document.getElementById('buscar');
        const filas = Array.from(document.querySelectorAll('.fila-compra'));
        input.addEventListener('input', () => {
            const q = input.value.trim().toLowerCase();
            filas.forEach(f => f.style.display = (!q || (f.dataset.text || '').toLowerCase().includes(q)) ? '' : 'none');
        });
    })();
</script>
</body>
</html>
