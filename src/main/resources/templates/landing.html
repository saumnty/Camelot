<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camelot - Gestión de tiendas y ventas</title>
  <meta name="description" content="Sistema web para gestión de tiendas, ventas, clientes y reportes. Proyecto desarrollado en Spring Boot.">
  <link rel="stylesheet" th:href="@{/css/landing.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
<div class="app-container">

  <!-- ================== SIDEBAR (IGUAL QUE producto.html) ================== -->
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

    <!-- ================== MAIN CONTENT ================== -->
  <main class="main-content">

    <header class="content-header">
      <div class="header-icons">
        <i class="fas fa-tv"></i>
        <i class="fas fa-laptop-code"></i>
        <i class="fas fa-mobile-alt"></i>
      </div>
      <div class="help-icon">
        <i class="fas fa-question-circle"></i>
      </div>
    </header>

    <section class="welcome-section">

      <!-- HEADER HOME -->
      <div class="home-header">
        <div>
          <h1>
            Bienvenido <span th:text="${nombre != null ? nombre : 'Usuario'}"></span>
            <span class="emoji">🤝</span>
          </h1>
          <p class="welcome-subtitle">
            Selecciona una tienda o crea una nueva
          </p>
        </div>

        <a th:href="@{/tiendas/nuevo}" class="btn-primary">
          Crear negocio
        </a>
      </div>

      <!-- ================== BUSCADOR ================== -->
      <div class="tiendas-search">
        <form method="get" action="/home" class="tiendas-search-form">
          <input type="text"
                 name="q"
                 placeholder="Buscar tiendas por nombre, categoría o ciudad..."
                 th:value="${q}">
          <button type="submit" class="tiendas-search-btn">
            <i class="fas fa-magnifying-glass"></i>
            Buscar
          </button>
        </form>
      </div>

      <!-- ================== TIENDAS NORMALES ================== -->
      <h2 class="section-title">Tiendas</h2>

      <section class="tiendas-grid">
        <a class="tienda-card"
           th:each="t : ${tiendasNormales}"
           th:href="@{/tiendas/{id}(id=${t.id})}">

          <div class="tienda-card-header">
            <div class="tienda-avatar"
                 th:text="${#strings.substring(t.nombre,0,1)}">T</div>

            <div class="tienda-title">
              <h3 th:text="${t.nombre}">Nombre tienda</h3>
              <p class="tienda-meta">
                <span th:text="${t.categoria}">Categoría</span>
                <span th:text="${t.ciudad}">Ciudad</span>
              </p>
            </div>
          </div>

          <p class="tienda-desc"
             th:text="${t.descripcion}">Descripción breve…</p>

          <div class="tienda-card-footer">
            <span class="tienda-footer-spacer"></span>
            <span class="tienda-ver-btn">Ver</span>
          </div>
        </a>

        <div class="tiendas-empty"
             th:if="${tiendasNormales == null || #lists.isEmpty(tiendasNormales)}">
          No hay tiendas disponibles.
        </div>
      </section>

      <!-- ================== TIENDAS PROVEEDORAS ================== -->
      <section th:if="${hayProveedoras}">
        <h2 class="section-title">Tiendas proveedoras</h2>

        <section class="tiendas-grid">
          <a class="tienda-card proveedor"
             th:each="t : ${tiendasProveedoras}"
             th:href="@{/tiendas/{id}(id=${t.id})}">

            <div class="tienda-card-header">
              <div class="tienda-avatar proveedor-avatar"
                   th:text="${#strings.substring(t.nombre,0,1)}">P</div>

              <div class="tienda-title">
                <h3 th:text="${t.nombre}">Proveedor</h3>
                <p class="tienda-meta">
                  <span th:text="${t.categoria}">Categoría</span>
                  <span th:text="${t.ciudad}">Ciudad</span>
                </p>
              </div>
            </div>

            <p class="tienda-desc"
               th:text="${t.descripcion}">Descripción proveedor…</p>

            <div class="tienda-card-footer">
              <span class="tienda-footer-spacer"></span>
              <span class="tienda-ver-btn">Ver</span>
            </div>
          </a>
        </section>
      </section>

    </section>
  </main>
</div>
</body>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.querySelector('.menu-toggle');
            const sidebar = document.querySelector('.sidebar');

            toggleBtn?.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
            });
        });
    </script>
</html>
